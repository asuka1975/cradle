name: cradle
version: "0.1.0-alpha.5"
description: Lean 仕様駆動開発のハーネス — 仕様は決定論的なハーネスである。探索から E2E まで、プロダクトオーナーがゆりかごに身を任せて開発をやりきるための skills / agents / rules / hooks。
author: asuka1975
license: GPL-3.0-only
repository: https://github.com/asuka1975/cradle
keywords: [lean, spec-driven, ddd, harness, claude-code, codex]

# Claude Code と Codex に配る。hooks は両者で同じ形、agents は APM が Codex の toml に写す、rules は Codex では AGENTS.md に compile される。
targets:
  - claude
  - codex

includes: auto

dependencies:
  apm: []
  mcp: []

scripts: {}
